<svg viewBox="0 0 1220 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svg-title svg-description"><title id="svg-title">Updating knowledge</title><desc id="svg-description">Build a complete release, verify its documents and index, then select it for Retrieval. Additions: merge with retained corpus before import. Current deployment: explicit local pin. GCS cutover: pending.</desc><style>
*{box-sizing:border-box}body{margin:0;background:#eaf0f6;color:#182d48;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{width:min(1240px,calc(100% - 40px),calc((100vh - 350px) * 1.75));margin:24px auto;background:white;border:1px solid #d2ddea;border-radius:18px;box-shadow:0 12px 36px #223d5c0b}header{padding:24px 28px 0}.status{color:#765b28;font-size:12px;letter-spacing:1px;font-weight:650}h1{font-size:30px;line-height:1.2;margin:10px 0}.purpose{font-size:15px;color:#53647d;margin:0 0 6px}svg{display:block;width:100%;height:auto}text{font-family:inherit;fill:#182d48}.node{cursor:pointer;outline:none}.node:hover rect,.node:focus rect,.node.selected rect{stroke-width:3.5;filter:drop-shadow(0 3px 5px #254c6a22)}.edge.active path{stroke:#177cb3;stroke-width:3}.footer{padding:0 28px 20px;font-size:14px;color:#53647d}.legend{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:10px}.legend span:before{content:"";display:inline-block;width:9px;height:9px;margin-right:7px;background:var(--color);border-radius:3px}.note{margin:0;font-size:14px;line-height:1.5}.controls{border-top:1px solid #dce5ef;padding:16px 28px;display:flex;align-items:center;gap:12px}button{font:inherit;font-size:14px;border:1px solid #b8c9db;background:#fff;border-radius:8px;padding:8px 14px;cursor:pointer}button:hover{background:#eff6ff}.hint{font-size:13px;color:#5b6e87}#details{border-top:1px solid #dce5ef;padding:18px 28px;min-height:108px;font-size:15px;line-height:1.6}#details strong{display:block;color:#182d48}@media(max-width:700px){main{width:calc(100% - 16px);margin:8px auto}header{padding:18px 18px 0}h1{font-size:24px}.controls{flex-wrap:wrap;padding:12px 18px}#details{padding:18px}}@media(prefers-reduced-motion:reduce){.pulse{display:none}}

svg {font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#879ab1"/></marker></defs><g class="edge" data-from="originals" data-to="convert"><path id="path0" d="M340 105 L440 105" fill="none" stroke="#879ab1" stroke-width="2" marker-end="url(#arrow)"/><circle class="pulse" data-path="path0" r="5" fill="#177cb3" opacity="0"/></g><g class="edge" data-from="convert" data-to="prepare"><path id="path1" d="M740 105 L840 105" fill="none" stroke="#879ab1" stroke-width="2" marker-end="url(#arrow)"/><circle class="pulse" data-path="path1" r="5" fill="#177cb3" opacity="0"/></g><g class="edge" data-from="prepare" data-to="embed"><path id="path2" d="M990 160 L990 300" fill="none" stroke="#879ab1" stroke-width="2" marker-end="url(#arrow)"/><circle class="pulse" data-path="path2" r="5" fill="#177cb3" opacity="0"/></g><g class="edge" data-from="embed" data-to="import"><path id="path3" d="M840 355 L740 355" fill="none" stroke="#879ab1" stroke-width="2" marker-end="url(#arrow)"/><circle class="pulse" data-path="path3" r="5" fill="#177cb3" opacity="0"/></g><g class="edge" data-from="import" data-to="activate"><path id="path4" d="M440 355 L340 355" fill="none" stroke="#879ab1" stroke-width="2" marker-end="url(#arrow)"/><circle class="pulse" data-path="path4" r="5" fill="#177cb3" opacity="0"/></g><g class="node" id="originals" role="button" tabindex="0" aria-label="Selected sources"><rect x="40" y="50" width="300" height="110" rx="14" fill="#edf9f5" stroke="#21836c" stroke-width="1.7"/><text x="56" y="74" fill="#21836c" font-size="11" font-weight="700" letter-spacing="1">INPUT</text><text x="56" y="106" font-size="22" font-weight="650">Selected sources</text><text x="56" y="134" font-size="15">Immutable original versions</text></g><g class="node" id="convert" role="button" tabindex="0" aria-label="Conversion"><rect x="440" y="50" width="300" height="110" rx="14" fill="#eff6ff" stroke="#3778b9" stroke-width="1.7"/><text x="456" y="74" fill="#3778b9" font-size="11" font-weight="700" letter-spacing="1">JOB 1</text><text x="456" y="106" font-size="22" font-weight="650">Conversion</text><text x="456" y="134" font-size="15">Extract text and source metadata</text></g><g class="node" id="prepare" role="button" tabindex="0" aria-label="Preparation"><rect x="840" y="50" width="300" height="110" rx="14" fill="#eff6ff" stroke="#3778b9" stroke-width="1.7"/><text x="856" y="74" fill="#3778b9" font-size="11" font-weight="700" letter-spacing="1">JOB 2</text><text x="856" y="106" font-size="22" font-weight="650">Preparation</text><text x="856" y="134" font-size="15">Full documents + stable chunks</text></g><g class="node" id="embed" role="button" tabindex="0" aria-label="Embedding"><rect x="840" y="300" width="300" height="110" rx="14" fill="#eff6ff" stroke="#3778b9" stroke-width="1.7"/><text x="856" y="324" fill="#3778b9" font-size="11" font-weight="700" letter-spacing="1">JOB 3</text><text x="856" y="356" font-size="22" font-weight="650">Embedding</text><text x="856" y="384" font-size="15">BGE vectors + model metadata</text></g><g class="node" id="import" role="button" tabindex="0" aria-label="Import + verify"><rect x="440" y="300" width="300" height="110" rx="14" fill="#eff6ff" stroke="#3778b9" stroke-width="1.7"/><text x="456" y="324" fill="#3778b9" font-size="11" font-weight="700" letter-spacing="1">JOB 4</text><text x="456" y="356" font-size="22" font-weight="650">Import + verify</text><text x="456" y="384" font-size="15">Complete bundle → fresh index</text></g><g class="node" id="activate" role="button" tabindex="0" aria-label="Activate Retrieval"><rect x="40" y="300" width="300" height="110" rx="14" fill="#fff6e8" stroke="#b9842f" stroke-width="1.7"/><text x="56" y="324" fill="#b9842f" font-size="11" font-weight="700" letter-spacing="1">DEPLOYMENT</text><text x="56" y="356" font-size="22" font-weight="650">Activate Retrieval</text><text x="56" y="384" font-size="15">Select matching documents + index</text></g></svg>