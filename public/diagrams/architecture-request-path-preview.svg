<svg viewBox="0 0 1440 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svg-title svg-description"><style>
*{box-sizing:border-box}body{margin:0;background:#eaf0f6;color:#182d48;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{width:min(1560px,calc(100% - 40px),calc((100vh - 320px)*2));margin:20px auto;background:#fff;border:1px solid #d2ddea;border-radius:18px;overflow:hidden;box-shadow:0 10px 28px #223d5c0b}header{padding:24px 28px 10px}h1{font-size:28px;line-height:1.2;margin:0 0 8px}header p{font-size:15px;line-height:1.5;margin:0;color:#53647d}.diagram{padding:8px}svg{display:block;width:100%;height:auto}svg text{font-family:inherit;fill:#182d48}.node{cursor:pointer;outline:none}.node:hover rect,.node:focus-visible rect,.node.selected rect{stroke-width:3.2}.title{font-size:21px;font-weight:650}.sub{font-size:15px;fill:#53647d}.label{font-size:14px;font-weight:600;fill:#53647d;paint-order:stroke;stroke:#fff;stroke-width:7;stroke-linejoin:round}.section{font-size:19px;font-weight:650;fill:#2768a4}.boundary{fill:#f4f9ff;stroke:#4384bf;stroke-width:2;stroke-dasharray:9 5}.edge path{fill:none;stroke:#879ab1;stroke-width:2.3;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#arrow)}.edge.amber path{stroke:#b9842f;marker-end:url(#amber-arrow)}.edge.blue path{stroke:#3778b9;marker-end:url(#blue-arrow)}.edge.purple path{stroke:#7962bd;marker-end:url(#purple-arrow)}.edge.dashed path{stroke-dasharray:6 5}.pulse{fill:#177cb3}.edge.amber .pulse{fill:#b9842f}.legend{display:flex;gap:18px;flex-wrap:wrap;padding:0 28px 14px;color:#53647d;font-size:13px}.legend span:before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--key);margin-right:7px}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px solid #dce5ef;padding:12px 28px;font-size:13px}.controls a{color:#2768a4;text-underline-offset:3px}.controls a[aria-current]{font-weight:700}.controls button{font:inherit;font-weight:600;color:#182d48;border:1px solid #b8c9db;border-radius:7px;padding:7px 12px;background:#fff;cursor:pointer}.controls button:hover{background:#eff6ff}.controls button:focus-visible,a:focus-visible{outline:2px solid #3778b9;outline-offset:3px}.hint{margin-left:auto;color:#53647d}#details{border-top:1px solid #dce5ef;padding:14px 28px 18px;min-height:83px;font-size:14px;line-height:1.5;color:#53647d}#details strong{display:block;color:#182d48;margin-bottom:3px}::selection{background:#cfe4fb;color:#182d48}@media(max-width:900px){main{width:calc(100% - 20px);margin:10px auto}.diagram{overflow:auto}svg{min-width:950px}.hint{margin-left:0}}@media(prefers-reduced-motion:reduce){.pulse{display:none}}@media print{main{width:100%;margin:0;border:0;box-shadow:none}.controls,#details{display:none}}
</style><title id="svg-title">One question, one answer</title><desc id="svg-description">Example: “What blocks the Atlas release?” The coordinator retrieves sources, calls a model and returns a checked answer. Select a component for its role. Animated paths illustrate the design, not live execution or measured latency.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#879ab1"/></marker><marker id="amber-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#b9842f"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#3778b9"/></marker><marker id="purple-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#7962bd"/></marker></defs><g class="edge "><path id="edge-0" d="M235 210 H270"/><circle class="pulse" data-path="edge-0" r="4.5"/></g><g class="edge "><path id="edge-1" d="M470 210 H505"/><circle class="pulse" data-path="edge-1" r="4.5"/></g><g class="edge "><path id="edge-2" d="M705 210 H740"/><circle class="pulse" data-path="edge-2" r="4.5"/></g><g class="edge "><path id="edge-3" d="M940 210 H975"/><circle class="pulse" data-path="edge-3" r="4.5"/></g><g class="edge "><path id="edge-4" d="M1175 210 H1210"/><circle class="pulse" data-path="edge-4" r="4.5"/></g><g class="edge "><path id="edge-5" d="M370 265 V365"/><circle class="pulse" data-path="edge-5" r="4.5"/></g><text x="429" y="330" text-anchor="middle" class="label">load / save</text><g class="edge "><path id="edge-7" d="M840 265 V365"/><circle class="pulse" data-path="edge-7" r="4.5"/></g><text x="897" y="330" text-anchor="middle" class="label">inference</text><text x="720" y="77" text-anchor="middle" class="section">The same AI Coordinator appears at planning and completion</text><g class="node" id="question" role="button" tabindex="0" aria-label="Question"><rect x="35" y="150" width="200" height="115" rx="13" fill="#f5f7fa" stroke="#71829a" stroke-width="1.7"/><text class="title" x="55" y="185">Question</text><text class="sub" x="55" y="212">Ask about Atlas</text><text class="sub" x="55" y="234">Topic / conversation</text></g><g class="node" id="plan" role="button" tabindex="0" aria-label="AI Coordinator"><rect x="270" y="150" width="200" height="115" rx="13" fill="#eff6ff" stroke="#3778b9" stroke-width="1.7"/><text class="title" x="290" y="185">AI Coordinator</text><text class="sub" x="290" y="212">Restore context</text><text class="sub" x="290" y="234">Plan retrieval</text></g><g class="node" id="retrieve" role="button" tabindex="0" aria-label="Retrieval MCP"><rect x="505" y="150" width="200" height="115" rx="13" fill="#edf9f5" stroke="#21836c" stroke-width="1.7"/><text class="title" x="525" y="185">Retrieval MCP</text><text class="sub" x="525" y="212">Encode · search · read</text><text class="sub" x="525" y="234">Return source evidence</text></g><g class="node" id="generate" role="button" tabindex="0" aria-label="Model call"><rect x="740" y="150" width="200" height="115" rx="13" fill="#f3efff" stroke="#7962bd" stroke-width="1.7"/><text class="title" x="760" y="185">Model call</text><text class="sub" x="760" y="212">Generate from evidence</text><text class="sub" x="760" y="234">Selected model route</text></g><g class="node" id="combine" role="button" tabindex="0" aria-label="AI Coordinator"><rect x="975" y="150" width="200" height="115" rx="13" fill="#eff6ff" stroke="#3778b9" stroke-width="1.7"/><text class="title" x="995" y="185">AI Coordinator</text><text class="sub" x="995" y="212">Check grounding</text><text class="sub" x="995" y="234">Combine results</text></g><g class="node" id="answer" role="button" tabindex="0" aria-label="Answer"><rect x="1210" y="150" width="200" height="115" rx="13" fill="#f5f7fa" stroke="#71829a" stroke-width="1.7"/><text class="title" x="1230" y="185">Answer</text><text class="sub" x="1230" y="212">Explain blockers</text><text class="sub" x="1230" y="234">Plain answer</text></g><g class="node" id="checkpoint" role="button" tabindex="0" aria-label="Conversation state"><rect x="270" y="365" width="270" height="100" rx="13" fill="#edf9f5" stroke="#21836c" stroke-width="1.7"/><text class="title" x="290" y="400">Conversation state</text><text class="sub" x="290" y="427">Retain conversation content</text><text class="sub" x="290" y="449">PostgreSQL</text></g><g class="node" id="backend" role="button" tabindex="0" aria-label="Model backends"><rect x="740" y="365" width="270" height="100" rx="13" fill="#f3efff" stroke="#7962bd" stroke-width="1.7"/><text class="title" x="760" y="400">Model backends</text><text class="sub" x="760" y="427">Run selected inference</text><text class="sub" x="760" y="449">Ollama · Fireworks AI</text></g></svg>
