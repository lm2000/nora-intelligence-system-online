<svg viewBox="0 0 1440 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svg-title svg-description"><style>
*{box-sizing:border-box}body{margin:0;background:#eaf0f6;color:#182d48;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{width:min(1560px,calc(100% - 40px),calc((100vh - 320px)*2));margin:20px auto;background:#fff;border:1px solid #d2ddea;border-radius:18px;overflow:hidden;box-shadow:0 10px 28px #223d5c0b}header{padding:24px 28px 10px}h1{font-size:28px;line-height:1.2;margin:0 0 8px}header p{font-size:15px;line-height:1.5;margin:0;color:#53647d}.diagram{padding:8px}svg{display:block;width:100%;height:auto}svg text{font-family:inherit;fill:#182d48}.node{cursor:pointer;outline:none}.node:hover rect,.node:focus-visible rect,.node.selected rect{stroke-width:3.2}.title{font-size:21px;font-weight:650}.sub{font-size:15px;fill:#53647d}.label{font-size:14px;font-weight:600;fill:#53647d;paint-order:stroke;stroke:#fff;stroke-width:7;stroke-linejoin:round}.section{font-size:19px;font-weight:650;fill:#2768a4}.boundary{fill:#f4f9ff;stroke:#4384bf;stroke-width:2;stroke-dasharray:9 5}.edge path{fill:none;stroke:#879ab1;stroke-width:2.3;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#arrow)}.edge.amber path{stroke:#b9842f;marker-end:url(#amber-arrow)}.edge.blue path{stroke:#3778b9;marker-end:url(#blue-arrow)}.edge.purple path{stroke:#7962bd;marker-end:url(#purple-arrow)}.edge.dashed path{stroke-dasharray:6 5}.pulse{fill:#177cb3}.edge.amber .pulse{fill:#b9842f}.legend{display:flex;gap:18px;flex-wrap:wrap;padding:0 28px 14px;color:#53647d;font-size:13px}.legend span:before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--key);margin-right:7px}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px solid #dce5ef;padding:12px 28px;font-size:13px}.controls a{color:#2768a4;text-underline-offset:3px}.controls a[aria-current]{font-weight:700}.controls button{font:inherit;font-weight:600;color:#182d48;border:1px solid #b8c9db;border-radius:7px;padding:7px 12px;background:#fff;cursor:pointer}.controls button:hover{background:#eff6ff}.controls button:focus-visible,a:focus-visible{outline:2px solid #3778b9;outline-offset:3px}.hint{margin-left:auto;color:#53647d}#details{border-top:1px solid #dce5ef;padding:14px 28px 18px;min-height:83px;font-size:14px;line-height:1.5;color:#53647d}#details strong{display:block;color:#182d48;margin-bottom:3px}::selection{background:#cfe4fb;color:#182d48}@media(max-width:900px){main{width:calc(100% - 20px);margin:10px auto}.diagram{overflow:auto}svg{min-width:950px}.hint{margin-left:0}}@media(prefers-reduced-motion:reduce){.pulse{display:none}}@media print{main{width:100%;margin:0;border:0;box-shadow:none}.controls,#details{display:none}}
</style><title id="svg-title">NIS Harness architecture</title><desc id="svg-description">One AI Coordinator plans work, delegates tasks and combines results across three workflows. Select a component for its role. Animated paths illustrate the design, not live execution or measured latency.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#879ab1"/></marker><marker id="amber-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#b9842f"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#3778b9"/></marker><marker id="purple-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#7962bd"/></marker></defs><rect class="boundary" x="515" y="32" width="895" height="390" rx="18"/><text x="537" y="63" class="section">Coordination Layer</text><g class="edge "><path id="edge-0" d="M225 155 H270"/><circle class="pulse" data-path="edge-0" r="4.5"/></g><text x="247" y="136" text-anchor="middle" class="label">MCP</text><g class="edge "><path id="edge-2" d="M480 155 H535"/><circle class="pulse" data-path="edge-2" r="4.5"/></g><text x="507" y="136" text-anchor="middle" class="label">MCP</text><g class="edge "><path id="edge-4" d="M765 155 H815"/><circle class="pulse" data-path="edge-4" r="4.5"/></g><text x="790" y="136" text-anchor="middle" class="label">invoke</text><g class="edge "><path id="edge-6" d="M225 340 H247 V235 H940 V210"/><circle class="pulse" data-path="edge-6" r="4.5"/></g><text x="398" y="225" text-anchor="middle" class="label">HTTP / AG-UI</text><g class="edge "><path id="edge-8" d="M885 210 V252 H650 V290"/><circle class="pulse" data-path="edge-8" r="4.5"/></g><text x="690" y="243" text-anchor="middle" class="label">question answering</text><g class="edge "><path id="edge-10" d="M940 210 V290"/><circle class="pulse" data-path="edge-10" r="4.5"/></g><g class="edge "><path id="edge-11" d="M1065 155 H1245 V290"/><circle class="pulse" data-path="edge-11" r="4.5"/></g><text x="1245" y="240" text-anchor="middle" class="label">delegate</text><g class="edge "><path id="edge-13" d="M650 390 V465 H390 V540"/><circle class="pulse" data-path="edge-13" r="4.5"/></g><text x="475" y="455" text-anchor="middle" class="label">search / read</text><g class="edge amber"><path id="edge-15" d="M940 390 V486 H670 V540"/><circle class="pulse" data-path="edge-15" r="4.5"/></g><text x="752" y="476" text-anchor="middle" class="label">review routes</text><g class="edge "><path id="edge-17" d="M1065 185 H1104 V500 H965 V540"/><circle class="pulse" data-path="edge-17" r="4.5"/></g><text x="1040" y="491" text-anchor="middle" class="label">model calls</text><g class="edge "><path id="edge-19" d="M1065 125 H1425 V505 H1250 V540"/><circle class="pulse" data-path="edge-19" r="4.5"/></g><text x="1315" y="495" text-anchor="middle" class="label">checkpoints</text><g class="edge amber"><path id="edge-21" d="M225 594 H270"/><circle class="pulse" data-path="edge-21" r="4.5"/></g><g class="node" id="clients" role="button" tabindex="0" aria-label="MCP clients"><rect x="30" y="105" width="195" height="105" rx="13" fill="#f5f7fa" stroke="#71829a" stroke-width="1.7"/><text class="title" x="50" y="140">MCP clients</text><text class="sub" x="50" y="167">Ask · continue chats</text><text class="sub" x="50" y="189">Codex / OpenClaw</text></g><g class="node" id="gateway" role="button" tabindex="0" aria-label="MCP Gateway"><rect x="270" y="105" width="210" height="105" rx="13" fill="#f3efff" stroke="#7962bd" stroke-width="1.7"/><text class="title" x="290" y="140">MCP Gateway</text><text class="sub" x="290" y="167">MCP tool access</text><text class="sub" x="290" y="189">LiteLLM Proxy</text></g><g class="node" id="mcp" role="button" tabindex="0" aria-label="MCP Server"><rect x="535" y="105" width="230" height="105" rx="13" fill="#f3efff" stroke="#7962bd" stroke-width="1.7"/><text class="title" x="555" y="140">MCP Server</text><text class="sub" x="555" y="167">Expose coordinator</text><text class="sub" x="555" y="189">FastMCP · ask_nis</text></g><g class="node" id="coordinator" role="button" tabindex="0" aria-label="AI Coordinator"><rect x="815" y="105" width="250" height="105" rx="13" fill="#eff6ff" stroke="#3778b9" stroke-width="1.7"/><text class="title" x="835" y="140">AI Coordinator</text><text class="sub" x="835" y="167">Plan · route · synthesize</text><text class="sub" x="835" y="189">Deep Agents / LangGraph</text></g><g class="node" id="browser" role="button" tabindex="0" aria-label="Browser UI"><rect x="30" y="290" width="195" height="100" rx="13" fill="#f5f7fa" stroke="#71829a" stroke-width="1.7"/><text class="title" x="50" y="325">Browser UI</text><text class="sub" x="50" y="352">Ask · inspect answers</text><text class="sub" x="50" y="374">CopilotKit / AG-UI</text></g><g class="node" id="answer" role="button" tabindex="0" aria-label="Question answering"><rect x="535" y="290" width="230" height="100" rx="13" fill="#eff6ff" stroke="#3778b9" stroke-width="1.7"/><text class="title" x="555" y="325">Question answering</text><text class="sub" x="555" y="352">Retrieve · check · answer</text></g><g class="node" id="review" role="button" tabindex="0" aria-label="Artifact evaluation"><rect x="815" y="290" width="250" height="100" rx="13" fill="#fff6e8" stroke="#b9842f" stroke-width="1.7"/><text class="title" x="835" y="325">Artifact evaluation</text><text class="sub" x="835" y="352">Feedback · score · revise</text></g><g class="node" id="subagents" role="button" tabindex="0" aria-label="Specialist subagents"><rect x="1120" y="290" width="260" height="100" rx="13" fill="#eff6ff" stroke="#3778b9" stroke-width="1.7"/><text class="title" x="1140" y="325">Specialist subagents</text><text class="sub" x="1140" y="352">Execute delegated tasks</text></g><g class="node" id="ingestion" role="button" tabindex="0" aria-label="Ingestion"><rect x="30" y="540" width="195" height="105" rx="13" fill="#fff6e8" stroke="#b9842f" stroke-width="1.7"/><text class="title" x="50" y="575">Ingestion</text><text class="sub" x="50" y="602">Prepare · verify</text><text class="sub" x="50" y="624">Activate release</text></g><g class="node" id="retrieval" role="button" tabindex="0" aria-label="Retrieval MCP"><rect x="270" y="540" width="240" height="105" rx="13" fill="#edf9f5" stroke="#21836c" stroke-width="1.7"/><text class="title" x="290" y="575">Retrieval MCP</text><text class="sub" x="290" y="602">Search · rank · read</text><text class="sub" x="290" y="624">BGE · Qdrant · source text</text></g><g class="node" id="evaluators" role="button" tabindex="0" aria-label="Evaluation services"><rect x="550" y="540" width="260" height="105" rx="13" fill="#fff6e8" stroke="#b9842f" stroke-width="1.7"/><text class="title" x="570" y="575">Evaluation services</text><text class="sub" x="570" y="602">Run tasks and judge models</text><text class="sub" x="570" y="624">Harbor Hub · Hugging Face</text></g><g class="node" id="models" role="button" tabindex="0" aria-label="Model backends"><rect x="850" y="540" width="230" height="128" rx="13" fill="#f3efff" stroke="#7962bd" stroke-width="1.7"/><text class="title" x="870" y="571">Model backends</text><text class="sub" x="870" y="598">Execute selected calls</text><text class="sub" x="870" y="620">Ollama · Fireworks AI</text><text class="sub" x="870" y="642">DeepSeek and other models</text></g><g class="node" id="state" role="button" tabindex="0" aria-label="Conversation state"><rect x="1120" y="540" width="260" height="105" rx="13" fill="#edf9f5" stroke="#21836c" stroke-width="1.7"/><text class="title" x="1140" y="575">Conversation state</text><text class="sub" x="1140" y="602">Retain checkpoints</text><text class="sub" x="1140" y="624">PostgreSQL</text></g></svg>
