<svg viewBox="0 0 1440 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svg-title svg-description"><style>
*{box-sizing:border-box}body{margin:0;background:#eaf0f6;color:#182d48;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{width:min(1560px,calc(100% - 40px),calc((100vh - 320px)*2));margin:20px auto;background:#fff;border:1px solid #d2ddea;border-radius:18px;overflow:hidden;box-shadow:0 10px 28px #223d5c0b}header{padding:24px 28px 10px}h1{font-size:28px;line-height:1.2;margin:0 0 8px}header p{font-size:15px;line-height:1.5;margin:0;color:#53647d}.diagram{padding:8px}svg{display:block;width:100%;height:auto}svg text{font-family:inherit;fill:#182d48}.node{cursor:pointer;outline:none}.node:hover rect,.node:focus-visible rect,.node.selected rect{stroke-width:3.2}.title{font-size:21px;font-weight:650}.sub{font-size:15px;fill:#53647d}.label{font-size:14px;font-weight:600;fill:#53647d;paint-order:stroke;stroke:#fff;stroke-width:7;stroke-linejoin:round}.section{font-size:19px;font-weight:650;fill:#2768a4}.boundary{fill:#f4f9ff;stroke:#4384bf;stroke-width:2;stroke-dasharray:9 5}.edge path{fill:none;stroke:#879ab1;stroke-width:2.3;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#arrow)}.edge.amber path{stroke:#b9842f;marker-end:url(#amber-arrow)}.edge.blue path{stroke:#3778b9;marker-end:url(#blue-arrow)}.edge.purple path{stroke:#7962bd;marker-end:url(#purple-arrow)}.edge.dashed path{stroke-dasharray:6 5}.pulse{fill:#177cb3}.edge.amber .pulse{fill:#b9842f}.legend{display:flex;gap:18px;flex-wrap:wrap;padding:0 28px 14px;color:#53647d;font-size:13px}.legend span:before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--key);margin-right:7px}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px solid #dce5ef;padding:12px 28px;font-size:13px}.controls a{color:#2768a4;text-underline-offset:3px}.controls a[aria-current]{font-weight:700}.controls button{font:inherit;font-weight:600;color:#182d48;border:1px solid #b8c9db;border-radius:7px;padding:7px 12px;background:#fff;cursor:pointer}.controls button:hover{background:#eff6ff}.controls button:focus-visible,a:focus-visible{outline:2px solid #3778b9;outline-offset:3px}.hint{margin-left:auto;color:#53647d}#details{border-top:1px solid #dce5ef;padding:14px 28px 18px;min-height:83px;font-size:14px;line-height:1.5;color:#53647d}#details strong{display:block;color:#182d48;margin-bottom:3px}::selection{background:#cfe4fb;color:#182d48}@media(max-width:900px){main{width:calc(100% - 20px);margin:10px auto}.diagram{overflow:auto}svg{min-width:950px}.hint{margin-left:0}}@media(prefers-reduced-motion:reduce){.pulse{display:none}}@media print{main{width:100%;margin:0;border:0;box-shadow:none}.controls,#details{display:none}}
</style><title id="svg-title">Model routing and orchestration</title><desc id="svg-description">The same AI Coordinator plans calls, selects one or more routes, then combines their results. Select a component for its role. Animated paths illustrate the design, not live execution or measured latency.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#879ab1"/></marker><marker id="amber-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#b9842f"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#3778b9"/></marker><marker id="purple-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#7962bd"/></marker></defs><g class="edge "><path id="edge-0" d="M245 330 H290"/><circle class="pulse" data-path="edge-0" r="4.5"/></g><g class="edge purple"><path id="edge-1" d="M540 330 H580 V95 H625"/><circle class="pulse" data-path="edge-1" r="4.5"/></g><g class="edge purple"><path id="edge-2" d="M540 330 H580 V255 H625"/><circle class="pulse" data-path="edge-2" r="4.5"/></g><g class="edge purple"><path id="edge-3" d="M540 330 H580 V415 H625"/><circle class="pulse" data-path="edge-3" r="4.5"/></g><g class="edge purple"><path id="edge-4" d="M540 330 H580 V575 H625"/><circle class="pulse" data-path="edge-4" r="4.5"/></g><g class="edge purple"><path id="edge-5" d="M885 95 H930 V305 H980"/><circle class="pulse" data-path="edge-5" r="4.5"/></g><g class="edge purple"><path id="edge-6" d="M885 255 H930 V325 H980"/><circle class="pulse" data-path="edge-6" r="4.5"/></g><g class="edge purple"><path id="edge-7" d="M885 415 H930 V345 H980"/><circle class="pulse" data-path="edge-7" r="4.5"/></g><g class="edge purple"><path id="edge-8" d="M885 575 H930 V365 H980"/><circle class="pulse" data-path="edge-8" r="4.5"/></g><g class="edge "><path id="edge-9" d="M1230 330 H1280"/><circle class="pulse" data-path="edge-9" r="4.5"/></g><g class="node" id="request" role="button" tabindex="0" aria-label="Inference request"><rect x="30" y="275" width="215" height="110" rx="13" fill="#f5f7fa" stroke="#71829a" stroke-width="1.7"/><text class="title" x="50" y="310">Inference request</text><text class="sub" x="50" y="337">Task · context · constraints</text></g><g class="node" id="planner" role="button" tabindex="0" aria-label="AI Coordinator"><rect x="290" y="275" width="250" height="110" rx="13" fill="#eff6ff" stroke="#3778b9" stroke-width="1.7"/><text class="title" x="310" y="310">AI Coordinator</text><text class="sub" x="310" y="337">Plan and route</text><text class="sub" x="310" y="359">Select model capabilities</text></g><g class="node" id="simple" role="button" tabindex="0" aria-label="Simple"><rect x="625" y="45" width="260" height="100" rx="13" fill="#f3efff" stroke="#7962bd" stroke-width="1.7"/><text class="title" x="645" y="80">Simple</text><text class="sub" x="645" y="107">Lightweight model route</text></g><g class="node" id="general" role="button" tabindex="0" aria-label="General"><rect x="625" y="205" width="260" height="100" rx="13" fill="#f3efff" stroke="#7962bd" stroke-width="1.7"/><text class="title" x="645" y="240">General</text><text class="sub" x="645" y="267">Broad task coverage</text></g><g class="node" id="reasoning" role="button" tabindex="0" aria-label="Reasoning"><rect x="625" y="365" width="260" height="100" rx="13" fill="#f3efff" stroke="#7962bd" stroke-width="1.7"/><text class="title" x="645" y="400">Reasoning</text><text class="sub" x="645" y="427">Deeper reasoning route</text></g><g class="node" id="specialized" role="button" tabindex="0" aria-label="Specialized"><rect x="625" y="525" width="260" height="100" rx="13" fill="#f3efff" stroke="#7962bd" stroke-width="1.7"/><text class="title" x="645" y="560">Specialized</text><text class="sub" x="645" y="587">Task model · Fireworks AI</text></g><g class="node" id="aggregate" role="button" tabindex="0" aria-label="AI Coordinator"><rect x="980" y="275" width="250" height="110" rx="13" fill="#eff6ff" stroke="#3778b9" stroke-width="1.7"/><text class="title" x="1000" y="310">AI Coordinator</text><text class="sub" x="1000" y="337">Gather results</text><text class="sub" x="1000" y="359">Synthesize and check</text></g><g class="node" id="response" role="button" tabindex="0" aria-label="Response"><rect x="1280" y="275" width="135" height="110" rx="13" fill="#f5f7fa" stroke="#71829a" stroke-width="1.7"/><text class="title" x="1300" y="310">Response</text><text class="sub" x="1300" y="337">Checked result</text></g></svg>
