<svg viewBox="0 0 1440 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svg-title svg-description"><style>
*{box-sizing:border-box}body{margin:0;background:#eaf0f6;color:#182d48;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{width:min(1560px,calc(100% - 40px),calc((100vh - 320px)*2));margin:20px auto;background:#fff;border:1px solid #d2ddea;border-radius:18px;overflow:hidden;box-shadow:0 10px 28px #223d5c0b}header{padding:24px 28px 10px}h1{font-size:28px;line-height:1.2;margin:0 0 8px}header p{font-size:15px;line-height:1.5;margin:0;color:#53647d}.diagram{padding:8px}svg{display:block;width:100%;height:auto}svg text{font-family:inherit;fill:#182d48}.node{cursor:pointer;outline:none}.node:hover rect,.node:focus-visible rect,.node.selected rect{stroke-width:3.2}.title{font-size:21px;font-weight:650}.sub{font-size:15px;fill:#53647d}.label{font-size:14px;font-weight:600;fill:#53647d;paint-order:stroke;stroke:#fff;stroke-width:7;stroke-linejoin:round}.section{font-size:19px;font-weight:650;fill:#2768a4}.boundary{fill:#f4f9ff;stroke:#4384bf;stroke-width:2;stroke-dasharray:9 5}.edge path{fill:none;stroke:#879ab1;stroke-width:2.3;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#arrow)}.edge.amber path{stroke:#b9842f;marker-end:url(#amber-arrow)}.edge.blue path{stroke:#3778b9;marker-end:url(#blue-arrow)}.edge.purple path{stroke:#7962bd;marker-end:url(#purple-arrow)}.edge.dashed path{stroke-dasharray:6 5}.pulse{fill:#177cb3}.edge.amber .pulse{fill:#b9842f}.legend{display:flex;gap:18px;flex-wrap:wrap;padding:0 28px 14px;color:#53647d;font-size:13px}.legend span:before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--key);margin-right:7px}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px solid #dce5ef;padding:12px 28px;font-size:13px}.controls a{color:#2768a4;text-underline-offset:3px}.controls a[aria-current]{font-weight:700}.controls button{font:inherit;font-weight:600;color:#182d48;border:1px solid #b8c9db;border-radius:7px;padding:7px 12px;background:#fff;cursor:pointer}.controls button:hover{background:#eff6ff}.controls button:focus-visible,a:focus-visible{outline:2px solid #3778b9;outline-offset:3px}.hint{margin-left:auto;color:#53647d}#details{border-top:1px solid #dce5ef;padding:14px 28px 18px;min-height:83px;font-size:14px;line-height:1.5;color:#53647d}#details strong{display:block;color:#182d48;margin-bottom:3px}::selection{background:#cfe4fb;color:#182d48}@media(max-width:900px){main{width:calc(100% - 20px);margin:10px auto}.diagram{overflow:auto}svg{min-width:950px}.hint{margin-left:0}}@media(prefers-reduced-motion:reduce){.pulse{display:none}}@media print{main{width:100%;margin:0;border:0;box-shadow:none}.controls,#details{display:none}}
</style><title id="svg-title">Three Harness workflows</title><desc id="svg-description">Three workflows have different inputs, results and approval boundaries; ingestion is operator-triggered. Select a component for its role. Animated paths illustrate the design, not live execution or measured latency.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#879ab1"/></marker><marker id="amber-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#b9842f"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#3778b9"/></marker><marker id="purple-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#7962bd"/></marker></defs><text x="35" y="60" text-anchor="start" class="section">Question answering</text><text x="35" y="265" text-anchor="start" class="section">Ingestion · operator-triggered</text><text x="35" y="470" text-anchor="start" class="section">Artifact evaluation</text><g class="edge "><path id="r0-step0" d="M320 130 H395"/><circle class="pulse" data-path="r0-step0" r="4.5"/></g><g class="edge "><path id="r0-step1" d="M680 130 H755"/><circle class="pulse" data-path="r0-step1" r="4.5"/></g><g class="edge "><path id="r0-step2" d="M1040 130 H1115"/><circle class="pulse" data-path="r0-step2" r="4.5"/></g><g class="edge amber"><path id="r1-step0" d="M320 335 H395"/><circle class="pulse" data-path="r1-step0" r="4.5"/></g><g class="edge amber"><path id="r1-step1" d="M680 335 H755"/><circle class="pulse" data-path="r1-step1" r="4.5"/></g><g class="edge amber"><path id="r1-step2" d="M1040 335 H1115"/><circle class="pulse" data-path="r1-step2" r="4.5"/></g><g class="edge amber"><path id="judge-review" d="M320 540H395"/><circle class="pulse" data-path="judge-review" r="4.5"/></g><g class="edge amber"><path id="synthetic-score" d="M680 540H755"/><circle class="pulse" data-path="synthetic-score" r="4.5"/></g><g class="edge amber"><path id="qualifying-score" d="M1040 540H1070V460H1257V490"/><circle class="pulse" data-path="qualifying-score" r="4.5"/></g><text x="1170" y="449" text-anchor="middle" class="label">Qualifies for owner review</text><g class="edge amber"><path id="synthetic-return" d="M850 590V620H175V590"/><circle class="pulse" data-path="synthetic-return" r="4.5"/></g><text x="510" y="612" text-anchor="middle" class="label">Below threshold → revise + re-evaluate</text><g class="edge blue"><path id="owner-return" d="M1257 590V665H15V540H35"/><circle class="pulse" data-path="owner-return" r="4.5"/></g><text x="760" y="657" text-anchor="middle" class="label">Owner requests changes → revise + re-evaluate</text><g class="node" id="r0-0" role="button" tabindex="0" aria-label="Client question"><rect x="35" y="80" width="285" height="100" rx="13" fill="#f5f7fa" stroke="#71829a" stroke-width="1.7"/><text class="title" x="55" y="115">Client question</text><text class="sub" x="55" y="142">Ask about Atlas</text></g><g class="node" id="r0-1" role="button" tabindex="0" aria-label="AI Coordinator"><rect x="395" y="80" width="285" height="100" rx="13" fill="#eff6ff" stroke="#3778b9" stroke-width="1.7"/><text class="title" x="415" y="115">AI Coordinator</text><text class="sub" x="415" y="142">Plan and retrieve</text></g><g class="node" id="r0-2" role="button" tabindex="0" aria-label="Retrieval + model"><rect x="755" y="80" width="285" height="100" rx="13" fill="#edf9f5" stroke="#21836c" stroke-width="1.7"/><text class="title" x="775" y="115">Retrieval + model</text><text class="sub" x="775" y="142">Find evidence · draft answer</text></g><g class="node" id="r0-3" role="button" tabindex="0" aria-label="Plain answer"><rect x="1115" y="80" width="285" height="100" rx="13" fill="#eff6ff" stroke="#3778b9" stroke-width="1.7"/><text class="title" x="1135" y="115">Plain answer</text><text class="sub" x="1135" y="142">Answer + retained conversation</text></g><g class="node" id="r1-0" role="button" tabindex="0" aria-label="Source documents"><rect x="35" y="285" width="285" height="100" rx="13" fill="#f5f7fa" stroke="#71829a" stroke-width="1.7"/><text class="title" x="55" y="320">Source documents</text><text class="sub" x="55" y="347">Supply new or revised material</text></g><g class="node" id="r1-1" role="button" tabindex="0" aria-label="Prepare and encode"><rect x="395" y="285" width="285" height="100" rx="13" fill="#fff6e8" stroke="#b9842f" stroke-width="1.7"/><text class="title" x="415" y="320">Prepare and encode</text><text class="sub" x="415" y="347">Preserve text · call shared BGE</text></g><g class="node" id="r1-2" role="button" tabindex="0" aria-label="Knowledge release"><rect x="755" y="285" width="285" height="100" rx="13" fill="#edf9f5" stroke="#21836c" stroke-width="1.7"/><text class="title" x="775" y="320">Knowledge release</text><text class="sub" x="775" y="347">Pair source text + Qdrant index</text></g><g class="node" id="r1-3" role="button" tabindex="0" aria-label="Verify and activate"><rect x="1115" y="285" width="285" height="100" rx="13" fill="#fff6e8" stroke="#b9842f" stroke-width="1.7"/><text class="title" x="1135" y="320">Verify and activate</text><text class="sub" x="1135" y="347">Check and select the release</text></g><g class="node" id="r2-0" role="button" tabindex="0" aria-label="Artifact + brief"><rect x="35" y="490" width="285" height="100" rx="13" fill="#f5f7fa" stroke="#71829a" stroke-width="1.7"/><text class="title" x="55" y="525">Artifact + brief</text><text class="sub" x="55" y="552">Freeze draft + evidence</text></g><g class="node" id="r2-1" role="button" tabindex="0" aria-label="Selected judges"><rect x="395" y="490" width="285" height="100" rx="13" fill="#fff6e8" stroke="#b9842f" stroke-width="1.7"/><text class="title" x="415" y="525">Selected judges</text><text class="sub" x="415" y="552">Review artifact</text><text class="sub" x="415" y="574">Harbor Hub / Hugging Face</text></g><g class="node" id="r2-2" role="button" tabindex="0" aria-label="Synthetic Owner"><rect x="755" y="490" width="285" height="100" rx="13" fill="#fff6e8" stroke="#b9842f" stroke-width="1.7"/><text class="title" x="775" y="525">Synthetic Owner</text><text class="sub" x="775" y="552">Score · recommend</text></g><g class="node" id="r2-3" role="button" tabindex="0" aria-label="Real Owner"><rect x="1115" y="490" width="285" height="100" rx="13" fill="#edf9f5" stroke="#21836c" stroke-width="1.7"/><text class="title" x="1135" y="525">Real Owner</text><text class="sub" x="1135" y="552">Approve / request changes</text></g></svg>
