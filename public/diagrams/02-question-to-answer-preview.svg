<svg viewBox="0 0 1440 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svg-title svg-description"><style>
*{box-sizing:border-box}body{margin:0;background:#eaf0f6;color:#182d48;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{width:min(1560px,calc(100% - 40px),calc((100vh - 320px)*2));margin:20px auto;background:#fff;border:1px solid #d2ddea;border-radius:18px;overflow:hidden;box-shadow:0 10px 28px #223d5c0b}header{padding:24px 28px 10px}h1{font-size:28px;line-height:1.2;margin:0 0 8px}header p{font-size:15px;line-height:1.5;margin:0;color:#53647d}.diagram{padding:8px}svg{display:block;width:100%;height:auto}svg text{font-family:inherit;fill:#182d48}.node{cursor:pointer;outline:none}.node:hover rect,.node:focus-visible rect,.node.selected rect{stroke-width:3.2}.title{font-size:21px;font-weight:650}.sub{font-size:15px;fill:#53647d}.label{font-size:14px;font-weight:600;fill:#53647d;paint-order:stroke;stroke:#fff;stroke-width:7;stroke-linejoin:round}.section{font-size:19px;font-weight:650;fill:#2768a4}.boundary{fill:#f4f9ff;stroke:#4384bf;stroke-width:2;stroke-dasharray:9 5}.edge path{fill:none;stroke:#879ab1;stroke-width:2.3;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#arrow)}.edge.amber path{stroke:#b9842f;marker-end:url(#amber-arrow)}.edge.blue path{stroke:#3778b9;marker-end:url(#blue-arrow)}.edge.purple path{stroke:#7962bd;marker-end:url(#purple-arrow)}.edge.dashed path{stroke-dasharray:6 5}.pulse{fill:#177cb3}.edge.amber .pulse{fill:#b9842f}.legend{display:flex;gap:18px;flex-wrap:wrap;padding:0 28px 14px;color:#53647d;font-size:13px}.legend span:before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--key);margin-right:7px}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px solid #dce5ef;padding:12px 28px;font-size:13px}.controls a{color:#2768a4;text-underline-offset:3px}.controls a[aria-current]{font-weight:700}.controls button{font:inherit;font-weight:600;color:#182d48;border:1px solid #b8c9db;border-radius:7px;padding:7px 12px;background:#fff;cursor:pointer}.controls button:hover{background:#eff6ff}.controls button:focus-visible,a:focus-visible{outline:2px solid #3778b9;outline-offset:3px}.hint{margin-left:auto;color:#53647d}#details{border-top:1px solid #dce5ef;padding:14px 28px 18px;min-height:83px;font-size:14px;line-height:1.5;color:#53647d}#details strong{display:block;color:#182d48;margin-bottom:3px}::selection{background:#cfe4fb;color:#182d48}@media(max-width:900px){main{width:calc(100% - 20px);margin:10px auto}.diagram{overflow:auto}svg{min-width:950px}.hint{margin-left:0}}@media(prefers-reduced-motion:reduce){.pulse{display:none}}@media print{main{width:100%;margin:0;border:0;box-shadow:none}.controls,#details{display:none}}
</style><title id="svg-title">Knowledge flow: ingestion and retrieval</title><desc id="svg-description">Ingestion prepares text and index together. Retrieval owns query encoding, search and source reads for each answer. The same BGE service uses document and query modes. Animated paths illustrate the design, not live execution or measured latency.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#879ab1"/></marker><marker id="amber-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#b9842f"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#3778b9"/></marker><marker id="purple-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#7962bd"/></marker></defs><text x="35" y="40" text-anchor="start" class="section">Ingestion</text><text x="35" y="360" text-anchor="start" class="section">Retrieval and answer</text><g class="edge "><path id="prepare-documents" d="M245 150H300"/><circle class="pulse" data-path="prepare-documents" r="4.5"/></g><g class="edge amber"><path id="encode-documents" d="M530 150H585"/><circle class="pulse" data-path="encode-documents" r="4.5"/></g><g class="edge amber"><path id="store-vectors" d="M700 210V240H1155V150H1170"/><circle class="pulse" data-path="store-vectors" r="4.5"/></g><text x="950" y="230" text-anchor="middle" class="label">store vectors</text><g class="edge amber"><path id="prepared-text" d="M415 100V65H1035V100"/><circle class="pulse" data-path="prepared-text" r="4.5"/></g><text x="730" y="55" text-anchor="middle" class="label">prepared full text</text><g class="edge "><path id="question-to-retrieval" d="M245 455H300"/><circle class="pulse" data-path="question-to-retrieval" r="4.5"/></g><g class="edge "><path id="evidence-result" d="M550 455H880"/><circle class="pulse" data-path="evidence-result" r="4.5"/></g><g class="edge "><path id="answer-from-evidence" d="M1110 455H1170"/><circle class="pulse" data-path="answer-from-evidence" r="4.5"/></g><g class="edge "><path id="read-prepared-text" d="M415 400V280H1035V200"/><circle class="pulse" data-path="read-prepared-text" r="4.5"/></g><text x="805" y="270" text-anchor="middle" class="label">read text</text><g class="edge "><path id="search-qdrant" d="M475 400V320H1285V200"/><circle class="pulse" data-path="search-qdrant" r="4.5"/></g><text x="1040" y="310" text-anchor="middle" class="label">search index</text><g class="edge purple"><path id="encode-query" d="M380 510V540H640V555"/><circle class="pulse" data-path="encode-query" r="4.5"/></g><text x="470" y="555" text-anchor="middle" class="label">encode query</text><g class="edge purple"><path id="query-vector" d="M750 555V525H475V510"/><circle class="pulse" data-path="query-vector" r="4.5"/></g><text x="660" y="515" text-anchor="middle" class="label">query vector</text><text x="720" y="695" text-anchor="middle" class="section">One active knowledge release pairs prepared text with its Qdrant index</text><g class="node" id="sources" role="button" tabindex="0" aria-label="Source documents"><rect x="35" y="100" width="210" height="110" rx="13" fill="#f5f7fa" stroke="#71829a" stroke-width="1.7"/><text class="title" x="55" y="135">Source material</text><text class="sub" x="55" y="162">Preserve original material</text></g><g class="node" id="prepare" role="button" tabindex="0" aria-label="Prepare source text"><rect x="300" y="100" width="230" height="110" rx="13" fill="#fff6e8" stroke="#b9842f" stroke-width="1.7"/><text class="title" x="320" y="135">Prepare source text</text><text class="sub" x="320" y="162">Convert · identify · split</text></g><g class="node" id="document-bge" role="button" tabindex="0" aria-label="Document encoding"><rect x="585" y="100" width="230" height="110" rx="13" fill="#f3efff" stroke="#7962bd" stroke-width="1.7"/><text class="title" x="605" y="135">Document encoding</text><text class="sub" x="605" y="162">Encode source excerpts</text><text class="sub" x="605" y="184">BGE · document mode</text></g><g class="node" id="prepared" role="button" tabindex="0" aria-label="Prepared text"><rect x="920" y="100" width="230" height="100" rx="13" fill="#edf9f5" stroke="#21836c" stroke-width="1.7"/><text class="title" x="940" y="135">Prepared text</text><text class="sub" x="940" y="162">Retain full source text</text></g><g class="node" id="index" role="button" tabindex="0" aria-label="Search index"><rect x="1170" y="100" width="230" height="100" rx="13" fill="#edf9f5" stroke="#21836c" stroke-width="1.7"/><text class="title" x="1190" y="135">Search index</text><text class="sub" x="1190" y="162">Find matching passages</text><text class="sub" x="1190" y="184">Qdrant · dense + lexical</text></g><g class="node" id="question" role="button" tabindex="0" aria-label="Question"><rect x="35" y="400" width="210" height="110" rx="13" fill="#f5f7fa" stroke="#71829a" stroke-width="1.7"/><text class="title" x="55" y="435">Question</text><text class="sub" x="55" y="462">AI Coordinator request</text></g><g class="node" id="retrieval" role="button" tabindex="0" aria-label="Retrieval MCP"><rect x="300" y="400" width="250" height="110" rx="13" fill="#edf9f5" stroke="#21836c" stroke-width="1.7"/><text class="title" x="320" y="435">Retrieval MCP</text><text class="sub" x="320" y="462">Encode · search · read</text><text class="sub" x="320" y="484">Own query and source access</text></g><g class="node" id="query-bge" role="button" tabindex="0" aria-label="Query encoding"><rect x="585" y="555" width="230" height="105" rx="13" fill="#f3efff" stroke="#7962bd" stroke-width="1.7"/><text class="title" x="605" y="590">Query encoding</text><text class="sub" x="605" y="617">Encode question vector</text><text class="sub" x="605" y="639">Shared BGE · query mode</text></g><g class="node" id="context" role="button" tabindex="0" aria-label="Evidence context"><rect x="880" y="400" width="230" height="110" rx="13" fill="#edf9f5" stroke="#21836c" stroke-width="1.7"/><text class="title" x="900" y="435">Evidence context</text><text class="sub" x="900" y="462">Return relevant passages</text></g><g class="node" id="answer" role="button" tabindex="0" aria-label="Grounded answer"><rect x="1170" y="400" width="230" height="110" rx="13" fill="#eff6ff" stroke="#3778b9" stroke-width="1.7"/><text class="title" x="1190" y="435">Grounded answer</text><text class="sub" x="1190" y="462">Coordinator checks result</text><text class="sub" x="1190" y="484">Return plain answer</text></g></svg>
