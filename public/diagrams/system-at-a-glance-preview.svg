<svg viewBox="0 0 1440 650" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svg-title svg-description"><style>
*{box-sizing:border-box}body{margin:0;background:#eaf0f6;color:#182d48;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{width:min(1560px,calc(100% - 40px),calc((100vh - 320px)*2));margin:20px auto;background:#fff;border:1px solid #d2ddea;border-radius:18px;overflow:hidden;box-shadow:0 10px 28px #223d5c0b}header{padding:24px 28px 10px}h1{font-size:28px;line-height:1.2;margin:0 0 8px}header p{font-size:15px;line-height:1.5;margin:0;color:#53647d}.diagram{padding:8px}svg{display:block;width:100%;height:auto}svg text{font-family:inherit;fill:#182d48}.node{cursor:pointer;outline:none}.node:hover rect,.node:focus-visible rect,.node.selected rect{stroke-width:3.2}.title{font-size:21px;font-weight:650}.sub{font-size:15px;fill:#53647d}.label{font-size:14px;font-weight:600;fill:#53647d;paint-order:stroke;stroke:#fff;stroke-width:7;stroke-linejoin:round}.section{font-size:19px;font-weight:650;fill:#2768a4}.boundary{fill:#f4f9ff;stroke:#4384bf;stroke-width:2;stroke-dasharray:9 5}.edge path{fill:none;stroke:#879ab1;stroke-width:2.3;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#arrow)}.edge.amber path{stroke:#b9842f;marker-end:url(#amber-arrow)}.edge.blue path{stroke:#3778b9;marker-end:url(#blue-arrow)}.edge.purple path{stroke:#7962bd;marker-end:url(#purple-arrow)}.edge.dashed path{stroke-dasharray:6 5}.pulse{fill:#177cb3}.edge.amber .pulse{fill:#b9842f}.legend{display:flex;gap:18px;flex-wrap:wrap;padding:0 28px 14px;color:#53647d;font-size:13px}.legend span:before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--key);margin-right:7px}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px solid #dce5ef;padding:12px 28px;font-size:13px}.controls a{color:#2768a4;text-underline-offset:3px}.controls a[aria-current]{font-weight:700}.controls button{font:inherit;font-weight:600;color:#182d48;border:1px solid #b8c9db;border-radius:7px;padding:7px 12px;background:#fff;cursor:pointer}.controls button:hover{background:#eff6ff}.controls button:focus-visible,a:focus-visible{outline:2px solid #3778b9;outline-offset:3px}.hint{margin-left:auto;color:#53647d}#details{border-top:1px solid #dce5ef;padding:14px 28px 18px;min-height:83px;font-size:14px;line-height:1.5;color:#53647d}#details strong{display:block;color:#182d48;margin-bottom:3px}::selection{background:#cfe4fb;color:#182d48}@media(max-width:900px){main{width:calc(100% - 20px);margin:10px auto}.diagram{overflow:auto}svg{min-width:950px}.hint{margin-left:0}}@media(prefers-reduced-motion:reduce){.pulse{display:none}}@media print{main{width:100%;margin:0;border:0;box-shadow:none}.controls,#details{display:none}}
</style><title id="svg-title">NIS Harness at a glance</title><desc id="svg-description">Clients, coordination, knowledge and review share one clear route from request to result. Select a component for its role. Animated paths illustrate the design, not live execution or measured latency.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#879ab1"/></marker><marker id="amber-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#b9842f"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#3778b9"/></marker><marker id="purple-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#7962bd"/></marker></defs><g class="edge "><path id="edge-0" d="M300 145 H555"/><circle class="pulse" data-path="edge-0" r="4.5"/></g><text x="425" y="128" text-anchor="middle" class="label">request</text><g class="edge "><path id="edge-2" d="M705 200 V290"/><circle class="pulse" data-path="edge-2" r="4.5"/></g><g class="edge amber"><path id="edge-3" d="M855 150 H1165 V290"/><circle class="pulse" data-path="edge-3" r="4.5"/></g><text x="1040" y="133" text-anchor="middle" class="label">select workflow</text><g class="edge "><path id="edge-5" d="M705 390 V485"/><circle class="pulse" data-path="edge-5" r="4.5"/></g><text x="755" y="450" text-anchor="middle" class="label">search / read</text><g class="edge amber"><path id="edge-7" d="M300 540 H555"/><circle class="pulse" data-path="edge-7" r="4.5"/></g><text x="425" y="523" text-anchor="middle" class="label">knowledge release</text><g class="edge "><path id="edge-9" d="M855 175 H1395 V540 H1345"/><circle class="pulse" data-path="edge-9" r="4.5"/></g><text x="1240" y="164" text-anchor="middle" class="label">model calls</text><g class="edge amber"><path id="edge-11" d="M1165 390 V455 H1345 V485"/><circle class="pulse" data-path="edge-11" r="4.5"/></g><text x="1260" y="446" text-anchor="middle" class="label">evaluation routes</text><g class="node" id="access" role="button" tabindex="0" aria-label="Client access"><rect x="40" y="90" width="260" height="125" rx="13" fill="#f5f7fa" stroke="#71829a" stroke-width="1.7"/><text class="title" x="60" y="125">Client access</text><text class="sub" x="60" y="152">Browser · CopilotKit / AG-UI</text><text class="sub" x="60" y="174">MCP · LiteLLM / FastMCP</text></g><g class="node" id="coordinator" role="button" tabindex="0" aria-label="AI Coordinator"><rect x="555" y="90" width="300" height="110" rx="13" fill="#eff6ff" stroke="#3778b9" stroke-width="1.7"/><text class="title" x="575" y="125">AI Coordinator</text><text class="sub" x="575" y="152">Plan · delegate · synthesize</text><text class="sub" x="575" y="174">Deep Agents / LangGraph</text></g><g class="node" id="answer" role="button" tabindex="0" aria-label="Question answering"><rect x="555" y="290" width="300" height="100" rx="13" fill="#eff6ff" stroke="#3778b9" stroke-width="1.7"/><text class="title" x="575" y="325">Question answering</text><text class="sub" x="575" y="352">Source-grounded answers</text></g><g class="node" id="review" role="button" tabindex="0" aria-label="Artifact evaluation"><rect x="1015" y="290" width="300" height="100" rx="13" fill="#fff6e8" stroke="#b9842f" stroke-width="1.7"/><text class="title" x="1035" y="325">Artifact evaluation</text><text class="sub" x="1035" y="352">Judges → Synthetic Owner</text><text class="sub" x="1035" y="374">Real Owner approval</text></g><g class="node" id="ingestion" role="button" tabindex="0" aria-label="Ingestion"><rect x="40" y="485" width="260" height="110" rx="13" fill="#fff6e8" stroke="#b9842f" stroke-width="1.7"/><text class="title" x="60" y="520">Ingestion</text><text class="sub" x="60" y="547">Prepare · verify · activate</text></g><g class="node" id="knowledge" role="button" tabindex="0" aria-label="Knowledge and state"><rect x="555" y="485" width="300" height="110" rx="13" fill="#edf9f5" stroke="#21836c" stroke-width="1.7"/><text class="title" x="575" y="520">Knowledge and state</text><text class="sub" x="575" y="547">BGE · Qdrant · prepared text</text><text class="sub" x="575" y="569">PostgreSQL checkpoints</text></g><g class="node" id="backends" role="button" tabindex="0" aria-label="Model and evaluation access"><rect x="1015" y="485" width="330" height="110" rx="13" fill="#f3efff" stroke="#7962bd" stroke-width="1.7"/><text class="title" x="1035" y="520">Model and evaluation access</text><text class="sub" x="1035" y="547">Ollama · Fireworks AI</text><text class="sub" x="1035" y="569">Harbor Hub · Hugging Face</text></g></svg>
