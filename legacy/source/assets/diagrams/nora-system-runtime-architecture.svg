<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1110" role="img" aria-labelledby="title desc">
  <title id="title">Nora AI Lab runtime ownership and data flow</title>
  <desc id="desc">A technical architecture map showing the intent and synthesis layer, LangGraph workflow state and control projection, knowledge and bounded execution data plane, and external adapters and design outputs.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081a2a"/><stop offset="1" stop-color="#0c2436"/></linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#12344a"/><stop offset="1" stop-color="#102b40"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#20d4c4"/><stop offset="1" stop-color="#49e6c7"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#010914" flood-opacity=".24"/></filter>
    <style>
      .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.muted{fill:#a3bbc9}.label{font-size:12px;font-weight:750;letter-spacing:2px}.title{fill:#f5fbff;font-size:24px;font-weight:730}.body{fill:#bdd0db;font-size:14px;font-weight:500}.tiny{font-size:10px;font-weight:760;letter-spacing:1px}.pill{font-size:9px;font-weight:800;letter-spacing:1px}.layer{font-size:12px;font-weight:800;letter-spacing:2.1px}.node{fill:#0c2335;stroke:#315069;stroke-width:1.2}.node-core{fill:url(#core);stroke:#42d4c6;stroke-width:1.4}.node-external{fill:#0b2031;stroke:#40708a;stroke-width:1.2}.divider{stroke:#27465b;stroke-width:1}.link{fill:none;stroke:#3dcdbf;stroke-width:1.8}.link-muted{fill:none;stroke:#55758a;stroke-width:1.4;stroke-dasharray:5 7}.status-current{fill:#123e42;stroke:#39d2c4}.status-proposed{fill:#26364c;stroke:#7087b2}.status-connected{fill:#153c50;stroke:#52b6e9}.status-scaffolded{fill:#3a3049;stroke:#b58aed}
    </style>
  </defs>

  <rect width="1440" height="1110" rx="26" fill="url(#canvas)"/>
  <path d="M0 132H1440M0 360H1440M0 628H1440M0 896H1440" stroke="#24445a" stroke-opacity=".72"/>
  <path d="M50 0V1110M300 0V1110M550 0V1110M800 0V1110M1050 0V1110M1300 0V1110" stroke="#1c384d" stroke-opacity=".42"/>
  <text x="64" y="66" class="sans label" fill="#76e8dc">NORA AI LAB · TECHNICAL ARCHITECTURE</text>
  <text x="64" y="104" class="sans title" font-size="32">Runtime ownership, state, evidence, and bounded execution.</text>
  <text x="64" y="128" class="sans body">One workflow state owner. Rebuildable projections. Cited knowledge. Explicit side-effect control.</text>
  <g class="sans" transform="translate(1100 52)">
    <circle cx="0" cy="0" r="5" fill="#37d1c1"/><text x="12" y="4" class="tiny muted">CURRENT VERIFIED</text>
    <circle cx="0" cy="25" r="5" fill="#6f87b4"/><text x="12" y="29" class="tiny muted">PROPOSED / IN PROGRESS</text>
    <circle cx="0" cy="50" r="5" fill="#55b8e8"/><text x="12" y="54" class="tiny muted">CONNECTED</text>
  </g>

  <!-- Layer 01 -->
  <g class="sans">
    <text x="64" y="178" class="layer" fill="#76e8dc">01 · INTENT, POLICY &amp; FINAL SYNTHESIS</text>
    <path d="M96 239H1344" class="link-muted"/>
    <g filter="url(#shadow)">
      <rect x="80" y="201" width="300" height="112" rx="15" class="node"/>
      <text x="104" y="235" class="title">Michael</text><text x="104" y="263" class="body">Goals · constraints · approval</text>
      <rect x="104" y="278" width="116" height="20" rx="10" class="status-current"/><text x="114" y="292" class="pill" fill="#77e9df">HUMAN AUTHORITY</text>
      <rect x="570" y="186" width="300" height="142" rx="16" class="node-core"/>
      <text x="594" y="220" class="title">Nora AI Lab / Codex</text><text x="594" y="246" class="body">Policy · routing · synthesis</text><text x="594" y="269" class="body">Current verified coordination</text>
      <rect x="594" y="287" width="132" height="20" rx="10" class="status-current"/><text x="604" y="301" class="pill" fill="#77e9df">CURRENT VERIFIED</text>
      <rect x="1060" y="201" width="300" height="112" rx="15" class="node"/>
      <text x="1084" y="235" class="title">Nora AI Lab synthesis</text><text x="1084" y="263" class="body">Answers · deliverables · evidence</text>
      <rect x="1084" y="278" width="142" height="20" rx="10" class="status-current"/><text x="1094" y="292" class="pill" fill="#77e9df">EXPLICIT OUTPUT</text>
    </g>
    <path d="M380 257H570M870 257H1060" class="link"/><path d="M552 251l18 6-18 6M1042 251l18 6-18 6" fill="#3dcdbf"/>
  </g>

  <!-- Layer 02 -->
  <g class="sans">
    <text x="64" y="406" class="layer" fill="#76e8dc">02 · WORKFLOW STATE &amp; CONTROL PROJECTION</text>
    <path d="M720 329V375" class="link"/><path d="M714 357l6 18 6-18" fill="#3dcdbf"/>
    <g filter="url(#shadow)">
      <rect x="80" y="430" width="385" height="142" rx="16" class="node-core"/>
      <text x="106" y="466" class="title">LangGraph Run State</text><text x="106" y="493" class="body">Sole workflow state owner</text><text x="106" y="516" class="body">Checkpoints · retry · resume</text>
      <rect x="106" y="535" width="98" height="20" rx="10" class="status-proposed"/><text x="116" y="549" class="pill" fill="#cbd7ff">PROPOSED</text>
      <rect x="526" y="430" width="385" height="142" rx="16" class="node-core"/>
      <text x="552" y="466" class="title">Nora AI Lab runtime</text><text x="552" y="493" class="body">Operation ledger · approval journal</text><text x="552" y="516" class="body">Transactional outbox · receipts</text>
      <rect x="552" y="535" width="98" height="20" rx="10" class="status-proposed"/><text x="562" y="549" class="pill" fill="#cbd7ff">PROPOSED</text>
      <rect x="972" y="430" width="385" height="142" rx="16" class="node-external"/>
      <text x="998" y="466" class="title">Hermes Projection</text><text x="998" y="493" class="body">Kanban · approvals · blocked work</text><text x="998" y="516" class="body">Audit trail · receipts</text>
      <rect x="998" y="535" width="122" height="20" rx="10" class="status-connected"/><text x="1008" y="549" class="pill" fill="#bce9ff">CONNECTED</text>
    </g>
    <path d="M465 501H526M911 501H972" class="link"/><path d="M508 495l18 6-18 6M954 495l18 6-18 6" fill="#3dcdbf"/>
    <path d="M1164 572V603H719V572" class="link-muted"/><text x="938" y="596" class="tiny muted">ORDERED OUTBOX · APPROVAL DECISION · RECOVERY COMMAND</text>
  </g>

  <!-- Layer 03 -->
  <g class="sans">
    <text x="64" y="674" class="layer" fill="#76e8dc">03 · KNOWLEDGE &amp; BOUNDED EXECUTION — DATA PLANE</text>
    <g filter="url(#shadow)">
      <rect x="80" y="700" width="250" height="126" rx="15" class="node"/>
      <text x="102" y="733" class="title" font-size="21">Deep Agent Executor</text><text x="102" y="759" class="body">Bounded task envelope</text><text x="102" y="781" class="body">Structured result + evidence</text><rect x="102" y="796" width="98" height="18" rx="9" class="status-proposed"/><text x="111" y="809" class="pill" fill="#cbd7ff">PROPOSED</text>
      <rect x="365" y="700" width="250" height="126" rx="15" class="node"/>
      <text x="387" y="733" class="title" font-size="21">Model Router</text><text x="387" y="759" class="body">Policy · budget · fallback</text><text x="387" y="781" class="body">Provider receipt</text><rect x="387" y="796" width="110" height="18" rx="9" class="status-proposed"/><text x="396" y="809" class="pill" fill="#cbd7ff">IN PROGRESS</text>
      <rect x="650" y="700" width="250" height="126" rx="15" class="node"/>
      <text x="672" y="733" class="title" font-size="21">Knowledge API</text><text x="672" y="759" class="body">Grounded retrieval + ingestion</text><text x="672" y="781" class="body">Cited passages + facts</text><rect x="672" y="796" width="98" height="18" rx="9" class="status-proposed"/><text x="681" y="809" class="pill" fill="#cbd7ff">PROPOSED</text>
      <rect x="935" y="700" width="422" height="126" rx="15" class="node"/>
      <text x="959" y="733" class="title" font-size="21">Durable Evidence Store</text><text x="959" y="759" class="body">Immutable artifacts · citation passages · facts</text><text x="959" y="781" class="body">PostgreSQL + pgvector · rebuildable embeddings</text><rect x="959" y="796" width="98" height="18" rx="9" class="status-proposed"/><text x="968" y="809" class="pill" fill="#cbd7ff">PROPOSED</text>
    </g>
    <path d="M330 763H365M615 763H650M900 763H935" class="link"/><path d="M347 757l18 6-18 6M632 757l18 6-18 6M917 757l18 6-18 6" fill="#3dcdbf"/>
    <path d="M718 628V686" class="link"/><path d="M712 668l6 18 6-18" fill="#3dcdbf"/>
  </g>

  <!-- Layer 04 -->
  <g class="sans">
    <text x="64" y="942" class="layer" fill="#76e8dc">04 · EXTERNAL ADAPTERS &amp; USER-FACING OUTPUTS</text>
    <g filter="url(#shadow)">
      <rect x="80" y="966" width="300" height="102" rx="15" class="node-external"/>
      <text x="104" y="999" class="title" font-size="21">Composio Tool Router</text><text x="104" y="1025" class="body">Managed auth · discovery · tool calls</text><rect x="104" y="1039" width="142" height="18" rx="9" class="status-current"/><text x="113" y="1052" class="pill" fill="#77e9df">CURRENT VERIFIED</text>
      <rect x="470" y="966" width="420" height="102" rx="15" class="node-external"/>
      <text x="494" y="999" class="title" font-size="21">External Routes &amp; Systems</text><text x="494" y="1025" class="body">GitHub · email · voice · practice · provider execution</text><rect x="494" y="1039" width="108" height="18" rx="9" class="status-connected"/><text x="503" y="1052" class="pill" fill="#bce9ff">CONNECTED</text>
      <rect x="980" y="966" width="377" height="102" rx="15" class="node-core"/>
      <text x="1004" y="999" class="title" font-size="21">Design Outputs</text><text x="1004" y="1025" class="body">Prep packs · drafts · learning · audio briefs</text><rect x="1004" y="1039" width="140" height="18" rx="9" class="status-current"/><text x="1013" y="1052" class="pill" fill="#77e9df">HUMAN-READY</text>
    </g>
    <path d="M380 1017H470M890 1017H980" class="link"/><path d="M452 1011l18 6-18 6M962 1011l18 6-18 6" fill="#3dcdbf"/>
    <path d="M1169 826V952" class="link-muted"/><text x="1182" y="901" class="tiny muted">RESULT + EVIDENCE</text>
  </g>
</svg>
